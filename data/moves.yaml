# Moves = the edges of the graph.
#
# Fields
#   id        unique, kebab-case
#   name      display name (keep naming consistent)
#   kind      move | styling | adjuster | compound
#               styling  = starts and ends in the same position ("double domino")
#               adjuster = small connector (hand change, catch, release, close frame)
#   from      where the move can start. One of:
#               any                       every position
#               open_LR                   a single position id
#               [open_LR, open_RR]        a list of position ids
#               {frame: closed}           an attribute pattern (lists = "one of")
#   to        where it ends. One of:
#               same                      same position it started in (default)
#               closed                    a position id
#               {arms: wrap, ...}         a change: start position with these
#                                         attributes replaced (must land on a known position)
#   counts    length in counts (any whole number, 0 = happens "on the fly")
#   weight    optional, soft:  {from: mirrored|parallel, to: mirrored|parallel}
#   opposite  optional id of the same move in the other direction
#   notes     free text
#   check     set when the start/end in this draft needs a dancer's review
#   level     1 beginner, 2 intermediate, 3 advanced (draft; compounds use their hardest part)
#   sequence  (compound only) list of move ids. These are live references, so
#             the start, end and counts are computed from the parts.
#
# This is a FIRST DRAFT. Review the ones marked `check` first.

