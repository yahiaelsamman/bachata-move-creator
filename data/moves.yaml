# Moves = the edges of the graph.
#
# Fields
#   id        unique, kebab-case
#   name      display name (keep naming consistent)
#   kind      move | styling | adjuster | compound
#               styling  = starts and ends in the same position ("double domino")
#               adjuster = small connector (hand change, catch, release, close frame)
#   from      where the move can start. One of:
#               any                       every position
#               open_LR                   a single position id
#               [open_LR, open_RR]        a list of position ids
#               {frame: closed}           an attribute pattern (lists = "one of")
#   to        where it ends. One of:
#               same                      same position it started in (default)
#               closed                    a position id
#               {arms: wrap, ...}         a change: start position with these
#                                         attributes replaced (must land on a known position)
#   counts    length in counts (any whole number, 0 = happens "on the fly")
#   weight    optional, soft:  {from: mirrored|parallel, to: mirrored|parallel}
#   opposite  optional id of the same move in the other direction
#   notes     free text
#   check     set when the start/end in this draft needs a dancer's review
#   sequence  (compound only) list of move ids. These are live references, so
#             the start, end and counts are computed from the parts.
#
# This is a FIRST DRAFT. Review the ones marked `check` first.

# ---------------------------------------------------------------- styling / in place
- id: basic
  name: Basic (side)
  kind: styling
  from: any
  counts: 4

- id: box-step
  name: Box step
  kind: styling
  from: [closed, open_LR, double]
  counts: 8

- id: tap-and-hold
  name: Tap & hold
  kind: styling
  from: any
  counts: 4
  notes: Musical pause / freeze on a break in the music.

- id: body-roll
  name: Body roll (together)
  kind: styling
  from: {frame: closed}
  counts: 4

- id: head-roll
  name: Led head roll
  kind: styling
  from: [closed, neck_wrap]
  counts: 4

- id: hip-circle
  name: Hip circle (together)
  kind: styling
  from: [closed, shadow, cuddle]
  counts: 4

- id: dominican-footwork
  name: Dominican footwork (in sync)
  kind: styling
  from: [closed, double, open_LR]
  counts: 4

- id: dip
  name: Dip
  kind: styling
  from: [closed, neck_wrap]
  counts: 4

- id: shadow-walk
  name: Shadow walk
  kind: styling
  from: shadow
  counts: 4
  weight: {from: parallel}

- id: hammerlock-walkaround
  name: Hammerlock walk-around
  kind: styling
  from: hammerlock_R
  counts: 8

- id: free-spin
  name: Follower free spin
  kind: styling
  from: apart
  counts: 4

# ---------------------------------------------------------------- turns & moves
- id: follower-right-turn
  name: Follower right turn
  kind: move
  from: [open_LR, open_RR]
  to: same
  counts: 4
  opposite: follower-left-turn

- id: follower-left-turn
  name: Follower left turn
  kind: move
  from: [open_LR, open_RR]
  to: same
  counts: 4
  opposite: follower-right-turn

- id: follower-double-right-turn
  name: Follower double right turn
  kind: move
  from: [open_LR, open_RR]
  to: same
  counts: 4

- id: leader-right-turn
  name: Leader right turn
  kind: move
  from: open_LR
  to: same
  counts: 4
  opposite: leader-left-turn

- id: leader-left-turn
  name: Leader left turn
  kind: move
  from: open_LR
  to: same
  counts: 4
  opposite: leader-right-turn

- id: cross-body-lead
  name: Cross body lead
  kind: move
  from: open_LR
  to: same
  counts: 8

- id: cbl-inside-turn
  name: Cross body lead with inside turn
  kind: move
  from: open_LR
  to: same
  counts: 8

- id: cuddle-entry
  name: Cuddle entry
  kind: move
  from: double
  to: cuddle
  counts: 4
  weight: {to: parallel}
  notes: Leader raises left hand, follower turns left into the wrap.

- id: cuddle-unwrap
  name: Cuddle unwrap
  kind: move
  from: cuddle
  to: double
  counts: 4
  weight: {to: mirrored}

- id: cuddle-release-spin
  name: Cuddle release spin
  kind: move
  from: cuddle
  to: open_LR
  counts: 4
  weight: {to: mirrored}
  notes: Release the right hand, follower unwinds to her right.

- id: cross-right-turn
  name: Crossed-hands right turn
  kind: move
  from: cross_Ltop
  to: cross_Rtop
  counts: 4
  opposite: cross-left-turn
  notes: Only possible with leader's left on top. With right on top the arms lock.
  check: Confirm the cross flips to right-over-left after the turn.

- id: cross-left-turn
  name: Crossed-hands left turn
  kind: move
  from: cross_Rtop
  to: cross_Ltop
  counts: 4
  opposite: cross-right-turn
  check: Confirm the cross flips to left-over-right after the turn.

- id: cross-half-turn-shadow
  name: Crossed half turn into shadow
  kind: move
  from: cross_Ltop
  to: shadow
  counts: 4
  weight: {to: parallel}
  check: Direction of the half turn and which cross allows it.

- id: shadow-exit
  name: Shadow exit turn
  kind: move
  from: shadow
  to: open_LL
  counts: 4
  weight: {to: mirrored}
  check: Which hand is kept after the exit.

- id: hammerlock-entry
  name: Hammerlock entry
  kind: move
  from: open_RR
  to: hammerlock_R
  counts: 4
  notes: Follower turns left with the right hand kept low; leader picks up her left hand.

- id: hammerlock-exit
  name: Hammerlock exit
  kind: move
  from: hammerlock_R
  to: open_RR
  counts: 4

- id: neck-slide
  name: Neck slide
  kind: move
  from: neck_wrap
  to: open_LR
  counts: 4
  notes: Follower's hand slides down the leader's arm, leader catches it with his left.

# ---------------------------------------------------------------- adjusters
- id: hand-change-to-handshake
  name: Hand change to handshake
  kind: adjuster
  from: open_LR
  to: open_RR
  counts: 4
  opposite: hand-change-to-open

- id: hand-change-to-open
  name: Hand change to open L-R
  kind: adjuster
  from: open_RR
  to: open_LR
  counts: 4
  opposite: hand-change-to-handshake

- id: hand-change-ll-to-lr
  name: Hand change L-L to L-R
  kind: adjuster
  from: open_LL
  to: open_LR
  counts: 4

- id: catch-second-hand
  name: Catch second hand
  kind: adjuster
  from: open_LR
  to: double
  counts: 0

- id: catch-left-hand
  name: Catch left hand
  kind: adjuster
  from: open_RL
  to: double
  counts: 0

- id: release-right
  name: Release right hand
  kind: adjuster
  from: double
  to: open_LR
  counts: 0

- id: release-left
  name: Release left hand
  kind: adjuster
  from: double
  to: open_RL
  counts: 0

- id: regrip-cross-r-over-l
  name: Regrip crossed (right over left)
  kind: adjuster
  from: open_RR
  to: cross_Rtop
  counts: 0
  notes: Keep the handshake on top, catch left-to-left underneath.

- id: regrip-cross-l-over-r
  name: Regrip crossed (left over right)
  kind: adjuster
  from: open_LL
  to: cross_Ltop
  counts: 0
  notes: Keep left-to-left on top, catch right-to-right underneath.

- id: release-cross-to-handshake
  name: Release cross to handshake
  kind: adjuster
  from: cross_Rtop
  to: open_RR
  counts: 0

- id: release-cross-to-ll
  name: Release cross to L-L
  kind: adjuster
  from: cross_Ltop
  to: open_LL
  counts: 0

- id: close-frame
  name: Close frame
  kind: adjuster
  from: open_LR
  to: closed
  counts: 4

- id: open-frame
  name: Open frame
  kind: adjuster
  from: closed
  to: open_LR
  counts: 4

- id: hand-to-neck
  name: Hand to neck
  kind: adjuster
  from: closed
  to: {hands: "R>back", arms: follower_R_behind_leader_neck}
  counts: 4
  notes: Leader places the follower's right hand behind his neck.

- id: release-all
  name: Release all
  kind: adjuster
  from: {frame: [closed, semi, open]}
  to: apart
  counts: 0

- id: reconnect
  name: Reconnect (left-to-right)
  kind: adjuster
  from: apart
  to: open_LR
  counts: 0

# ---------------------------------------------------------------- compound moves
- id: classic-opener
  name: Classic opener
  kind: compound
  sequence: [cross-body-lead, follower-right-turn, close-frame, dip]

- id: cuddle-combo
  name: Cuddle combo
  kind: compound
  sequence: [catch-second-hand, cuddle-entry, body-roll, cuddle-release-spin]
