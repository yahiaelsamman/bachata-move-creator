  to: same
  counts: 8

- id: cuddle-entry
  name: Cuddle entry
  kind: move
  level: 2
  from: double
  to: cuddle
  counts: 4
  weight: {to: parallel}
  notes: Leader raises left hand, follower turns left into the wrap.

- id: cuddle-unwrap
  name: Cuddle unwrap
  kind: move
  level: 2
  from: cuddle
  to: double
  counts: 4
  weight: {to: mirrored}

- id: cuddle-release-spin
  name: Cuddle release spin
  kind: move
  level: 2
  from: cuddle
  to: open_LR
  counts: 4
  weight: {to: mirrored}
  notes: Release the right hand, follower unwinds to her right.

- id: cross-right-turn
  name: Crossed-hands right turn
  kind: move
  level: 2
  from: cross_Ltop
  to: cross_Rtop
  counts: 4
  opposite: cross-left-turn
  notes: Only possible with leader's left on top. With right on top the arms lock.
  check: "Conflicting sources: Library of Dance and a common rule of thumb say you turn toward the hand on top, i.e. the right turn is led from right-over-left. This draft follows your rule (left over right allows the right turn). Decide which is true for you."

- id: cross-left-turn
  name: Crossed-hands left turn
  kind: move
  level: 2
  from: cross_Rtop
  to: cross_Ltop
  counts: 4
  opposite: cross-right-turn
  check: "See the crossed-hands right turn: sources suggest the turn from right-over-left is a right (outside) turn, not a left turn."

- id: cross-half-turn-shadow
  name: Crossed half turn into shadow
  kind: move
  level: 2
  from: cross_Ltop
  to: shadow
  counts: 4
  weight: {to: parallel}
  opposite: cross-half-turn-shadow-left
  check: Direction of the half turn and which cross allows it.

- id: shadow-exit
  name: Shadow exit turn
  kind: move
  level: 2
  from: shadow
  to: open_LL
  counts: 4
  weight: {to: mirrored}
  check: Which hand is kept after the exit.

- id: hammerlock-entry
  name: Hammerlock entry
  kind: move
  level: 2
  from: open_RR
  to: hammerlock_R
  counts: 4
  notes: Follower turns left with the right hand kept low; leader picks up her left hand.

- id: hammerlock-exit
  name: Hammerlock exit
