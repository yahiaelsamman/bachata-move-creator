  to: same
  counts: 4
  opposite: leader-left-turn

- id: leader-left-turn
  name: Leader left turn
  kind: move
  level: 2
  from: open_LR
  to: same
  counts: 4
  opposite: leader-right-turn

- id: cross-body-lead
  name: Cross body lead
  kind: move
  level: 1
  from: open_LR
  to: same
  counts: 8

- id: cbl-inside-turn
  name: Cross body lead with inside turn
