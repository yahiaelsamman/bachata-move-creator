# Positions = the nodes of the graph.
#
# A position is identified by its attributes (hard keys). Two positions with
# identical attributes are an error: they are the same node.
#
# Attributes
#   orientation: facing | shadow (leader behind) | reverse_shadow (follower behind)
#                | side_by_side_L (follower on leader's left) | side_by_side_R
#                | hip_to_hip | back_to_back
#   frame:       closed (body contact) | semi | open (arm's length) | apart
#   hands:       comma-separated connections, written leader-hand > follower-contact
#                  L>R      leader's left holds follower's right hand
#                  R>back   leader's right hand on follower's back
#                  (contact points: L / R hand, back, waist, shoulder)
#                "" means no connection. Order does not matter.
#   crossed:     none | leader_R_over_L | leader_L_over_R
#   arms:        neutral | hammerlock_follower_R | hammerlock_follower_L | wrap
#                | wrap_follower_R (the follower's right arm across the waist, one-hand wrap)
#                | hammerlock_leader_L (the leader's own left arm behind the back)
#                | follower_R_behind_leader_neck
#
# Optional, for people (not part of the node's identity):
#   notes:       what the hold looks like, in plain words
#   aka:         other names, including other languages
#   source:      where the hold is described
#
# Weight (mirrored / parallel) and timing are NOT part of a position: they are
# soft and tracked along the strip instead.

- id: open_LR
  name: Open, left-to-right
  short: Open L-R
  orientation: facing
  frame: open
  hands: "L>R"
  crossed: none
  arms: neutral
  notes: "The normal open hold: facing at arm's length, the leader's left hand holds the follower's right."
  aka: [open position, "otkrytaya pozitsiya (Russian)"]

- id: open_RR
  name: Handshake (right-to-right)
  short: Handshake
  orientation: facing
  frame: open
  hands: "R>R"
  crossed: none
  arms: neutral
  aka: [right-to-right, "hello position (Russian: khelou pozishn)"]

- id: open_LL
  name: Open, left-to-left
  short: Open L-L
  orientation: facing
  frame: open
  hands: "L>L"
  crossed: none
  arms: neutral
  aka: ["hello position (Russian: khelou pozishn)"]

- id: open_RL
  name: Open, right-to-left
  short: Open R-L
  orientation: facing
  frame: open
  hands: "R>L"
  crossed: none
  arms: neutral

- id: double
  name: Double hands
  short: Double
  orientation: facing
  frame: open
  hands: "L>R,R>L"
  crossed: none
  arms: neutral
  notes: "Both hands held, not crossed. Use a loose hook grip (fingers, no thumbs) so the hands can rotate."
  aka: [two hands, "otkrytaya pozitsiya (Russian)"]

- id: cross_Rtop
  name: Crossed hands, right over left
  short: Cross R/L
  orientation: facing
  frame: open
  hands: "L>L,R>R"
  crossed: leader_R_over_L
  arms: neutral
  notes: "Left-to-left and right-to-right, the right hands on top. The follower's free turn from here is to the left."
  aka: [cross hand, "krest v rukakh (Russian)"]

- id: cross_Ltop
  name: Crossed hands, left over right
  short: Cross L/R
  orientation: facing
  frame: open
  hands: "L>L,R>R"
  crossed: leader_L_over_R
  arms: neutral
  notes: "Left-to-left and right-to-right, the left hands on top. The follower's free turn from here is to the right."
  aka: [cross hand, "krest v rukakh (Russian)"]

- id: closed
  name: Closed position
  short: Closed
  orientation: facing
  frame: closed
  hands: "L>R,R>back"
  crossed: none
  arms: neutral
  notes: "The leader's right hand on the follower's upper back, the left holding the follower's right hand; the follower's left hand rests on the leader's shoulder."
  aka: [embrace, "zakrytaya pozitsiya (Russian)"]

- id: full_contact
  name: Full contact (both hands on the follower's back)
  short: Full contact
  orientation: facing
  frame: closed
  hands: "L>back,R>back"
  crossed: none
  arms: neutral
  notes: "Sensual closed hold: both of the leader's palms on the follower's shoulder blades, the follower's hands on the leader's shoulders, chests close."
  aka: ["polnyy kontakt (Russian)", "zakrytaya (Russian sensual closed)"]
  source: bachatamap.ru/theory/positions/full-contact-position/

- id: neck_wrap
  name: Follower's hand behind leader's neck
  short: Neck wrap
  orientation: facing
  frame: closed
  hands: "R>back"
  crossed: none
  arms: follower_R_behind_leader_neck
  notes: "Closed, but the follower's right hand rests behind the leader's neck; the leader's right hand on the follower's back, the left is free."
  aka: ["na zatylke partnera (Russian)"]

- id: hammerlock_R
  name: Hammerlock, right arm (crossed hands)
  short: Hammerlock R (cross)
  orientation: facing
  frame: semi
  hands: "L>L,R>R"
  crossed: none
  arms: hammerlock_follower_R
  notes: "Left-to-left and right-to-right. The follower's right arm is folded behind the back to her left hip: the leader's right hand reaches round her left side and holds it at the small of the back, never pushed up. The left hands are joined in front."
  aka: [candado (Spanish), Brezel (German), "khamerlok / setenta (Russian)"]

- id: hammerlock_R_double
  name: Hammerlock, right arm (double hands)
  short: Hammerlock R
  orientation: facing
  frame: semi
  hands: "L>R,R>L"
  crossed: none
  arms: hammerlock_follower_R
  notes: "Double hands, the follower's right arm folded behind the back: the folded arm ends at her left hip, so the leader's left hand reaches diagonally across in front of her body to hold it. The leader's right holds the follower's left in front. The mirror of the left-arm hammerlock."

- id: hammerlock_L_cross
  name: Hammerlock, left arm (crossed hands)
  short: Hammerlock L (cross)
  orientation: facing
  frame: semi
  hands: "L>L,R>R"
  crossed: none
  arms: hammerlock_follower_L
  notes: "Left-to-left and right-to-right. The follower's left arm is folded behind the back to her right hip: the leader's left hand reaches round her right side and holds it at the small of the back. The right hands are joined in front. The mirror of the crossed-hands right-arm hammerlock."

- id: hammerlock_L
  name: Hammerlock, left arm (double hands)
  short: Hammerlock L
  orientation: facing
  frame: semi
  hands: "L>R,R>L"
  crossed: none
  arms: hammerlock_follower_L
  notes: "Double hands, the follower's left arm folded behind the back: the folded arm ends at her right hip, so the leader's right hand reaches diagonally across in front of her body (and in front of his own) to hold it at the small of the back, never pushed up. The leader's left holds the follower's right in front."
  aka: [tour espagnol (French), "khamerlok devushki (Russian)"]

- id: hammerlock_leader_L
  name: Leader's hammerlock (leader's left arm behind the back)
  short: Leader hammerlock
  orientation: facing
  frame: semi
  hands: "L>R,R>L"
  crossed: none
  arms: hammerlock_leader_L
  notes: "Double hands, but the leader's own left arm (holding the follower's right hand) is behind the leader's back after a right turn."
  aka: ["khamerlok muzhchiny / setenta (Russian)", hamlet inverso (Spanish)]
  source: bachatamap.ru/moderna/rotations/turns/hamerlok-muzhchiny/

- id: cuddle
  name: Cuddle / wrap (side)
  short: Cuddle
  orientation: side_by_side_R
  frame: closed
  hands: "L>R,R>L"
  crossed: none
  arms: wrap
  notes: "The follower stands at the leader's right side, arms crossed in front, both hands still held."
  aka: [wrap, envoltura (Spanish), enroule (French), "pod krylo, krendel, kolybel, konfetka, obyortka (Russian)"]

- id: wrap_R
  name: One-hand wrap
  short: Wrap
  orientation: side_by_side_R
  frame: closed
  hands: "L>R,R>back"
  crossed: none
  arms: wrap_follower_R
  notes: "The follower is at the leader's right side; the follower's right arm crosses the waist, held by the leader's left, and the leader's right hand is on the follower's back."
  aka: [one-hand cuddle]

- id: shadow
  name: Shadow (leader behind, same hands)
  short: Shadow
  orientation: shadow
  frame: closed
  hands: "L>L,R>R"
  crossed: none
  arms: neutral
  notes: "The leader is behind the follower, slightly to the follower's left, holding left-to-left and right-to-right."
  aka: [sombra (Spanish), Schatten (German), "tenevaya pozitsiya (Russian)"]

- id: shadow_waist
  name: Shadow, hand on waist
  short: Shadow waist
  orientation: shadow
  frame: closed
  hands: "L>R,R>waist"
  crossed: none
  arms: neutral
  notes: "The leader is behind, the right hand on the follower's waist or stomach. The follower's right arm lies across the waist in front, and the leader's left arm reaches around the follower's left side to hold that hand at the left hip."
  aka: [sombra (Spanish), "tenevaya pozitsiya (Russian)"]

- id: shadow_neck
  name: Shadow, follower's hand behind your neck
  short: Shadow neck
  orientation: shadow
  frame: closed
  hands: "R>waist"
  crossed: none
  arms: follower_R_behind_leader_neck
  notes: "Shadow with the follower's right hand reaching back to the leader's neck; the leader's right hand on the follower's waist, the left free on the follower's arm or side."

- id: shadow_wrap
  name: Sweetheart (wrapped, leader behind)
  short: Sweetheart
  orientation: shadow
  frame: closed
  hands: "L>R,R>L"
  crossed: none
  arms: wrap
  notes: "The leader is right behind the follower, both hands held, the follower's arms crossed on the waist and the leader's arms around them."
  aka: [sweetheart, wrap from behind]

- id: leader_shadow
  name: Leader's shadow (leader in front, follower behind)
  short: Leader shadow
  orientation: reverse_shadow
  frame: closed
  hands: "L>L,R>R"
  crossed: none
  arms: neutral
  notes: "The leader is in front facing away; the follower's arms slide under the leader's, forearms resting on the leader's."
  aka: [sombra de lider (Spanish), "tenevaya muzhskaya, obratnaya tenevaya, manto (Russian)"]

- id: apart
  name: Apart (no connection)
  short: Apart
  orientation: facing
  frame: apart
  hands: ""
  crossed: none
  arms: neutral
