# Generated by scripts/build.mjs from data/positions.yaml. Do not edit by hand.
name: Suggest a move
description: Propose a bachata move for the map. No coding needed.
title: "Move: "
labels: ["new move"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding to the map. Every move starts in one position and ends in another,
        like a domino. If you're not sure about a field, leave a note at the bottom.
  - type: input
    id: name
    attributes:
      label: Move name
      description: "Family first, then the variant in brackets, e.g. Hammerlock entry (left arm)"
    validations:
      required: true
  - type: dropdown
    id: from
    attributes:
      label: Starts in
      description: Pick every position the move can start from.
      multiple: true
      options:
        - "Open, left-to-right (open_LR)"
        - "Handshake (right-to-right) (open_RR)"
        - "Open, left-to-left (open_LL)"
        - "Open, right-to-left (open_RL)"
        - "Double hands (double)"
        - "Double hands, twisted (braid) (double_braided)"
        - "Crossed hands, right over left (cross_Rtop)"
        - "Crossed hands, left over right (cross_Ltop)"
        - "Closed position (closed)"
        - "Full contact (both hands on her back) (full_contact)"
        - "Follower's hand behind leader's neck (neck_wrap)"
        - "Hammerlock (follower's right arm behind her back) (hammerlock_R)"
        - "Hammerlock, left arm (follower's left arm behind her back) (hammerlock_L)"
        - "Leader's hammerlock (his left arm behind his back) (hammerlock_leader_L)"
        - "Cuddle / wrap (side) (cuddle)"
        - "One-hand wrap (wrap_R)"
        - "Shadow (leader behind, same hands) (shadow)"
        - "Shadow, hand on waist (shadow_waist)"
        - "Shadow, her hand behind your neck (shadow_neck)"
        - "Sweetheart (wrapped, leader behind) (shadow_wrap)"
        - "Leader's shadow (leader in front, follower behind) (leader_shadow)"
        - "Apart (no connection) (apart)"
        - "Another position (describe below)"
    validations:
      required: true
  - type: dropdown
    id: to
    attributes:
      label: Ends in
      options:
        - "Same position it started in (styling)"
        - "Open, left-to-right (open_LR)"
        - "Handshake (right-to-right) (open_RR)"
        - "Open, left-to-left (open_LL)"
        - "Open, right-to-left (open_RL)"
        - "Double hands (double)"
        - "Double hands, twisted (braid) (double_braided)"
        - "Crossed hands, right over left (cross_Rtop)"
        - "Crossed hands, left over right (cross_Ltop)"
        - "Closed position (closed)"
        - "Full contact (both hands on her back) (full_contact)"
        - "Follower's hand behind leader's neck (neck_wrap)"
        - "Hammerlock (follower's right arm behind her back) (hammerlock_R)"
        - "Hammerlock, left arm (follower's left arm behind her back) (hammerlock_L)"
        - "Leader's hammerlock (his left arm behind his back) (hammerlock_leader_L)"
        - "Cuddle / wrap (side) (cuddle)"
        - "One-hand wrap (wrap_R)"
        - "Shadow (leader behind, same hands) (shadow)"
        - "Shadow, hand on waist (shadow_waist)"
        - "Shadow, her hand behind your neck (shadow_neck)"
        - "Sweetheart (wrapped, leader behind) (shadow_wrap)"
        - "Leader's shadow (leader in front, follower behind) (leader_shadow)"
        - "Apart (no connection) (apart)"
        - "Another position (describe below)"
    validations:
      required: true
  - type: input
    id: counts
    attributes:
      label: Counts
      description: "How many counts it takes (4, 8, ... or 0 if it happens on the fly)"
  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - beginner
        - intermediate
        - advanced
  - type: textarea
    id: lead
    attributes:
      label: How to lead it
      description: Hands, turn direction, timing, anything that makes it work.
  - type: input
    id: video
    attributes:
      label: Video or source (optional)
  - type: textarea
    id: notes
    attributes:
      label: Anything else
