<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Practice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1000px;height:680px;box-sizing:border-box;position:relative;overflow:hidden;background:{{c.bg}};padding:24px 28px 46px;font-family:'Asap',sans-serif;color:{{c.ink}};display:flex;flex-direction:column;gap:12px">
  <div style="display:flex;align-items:center;gap:26px;height:52px;background:{{c.accent}};border-radius:12px;padding:0 18px;flex:none">
    <div style="display:flex;align-items:center;gap:10px"><svg width="38" height="24" viewBox="0 0 38 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="{{c.ink}}"/><circle cx="26" cy="12" r="9" fill="{{c.move}}"/></svg><div style="font-size:22px;font-weight:800;letter-spacing:-.5px">Bachata Move Creator</div></div>
    <div style="margin-left:auto;display:flex;gap:8px;font-size:13px;font-weight:700"><div style="border:2px solid {{c.ink}};padding:7px 16px;border-radius:999px">Back to build</div></div>
  </div>
  <div style="display:flex;gap:20px;flex:1;min-height:0">
    <div style="flex:1;background:{{c.panel}};border:2px solid {{c.ink}};border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px">
      <div style="position:absolute;left:16px;top:14px;font-size:11px;font-weight:800;letter-spacing:2px;color:{{c.muted}}">NOW &middot; MOVE 2 OF 4</div>
      <div style="position:absolute;right:16px;top:14px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700"><i style="width:8px;height:8px;border-radius:50%;background:{{c.move}}"></i>move</div>
      <svg width="260" height="300" viewBox="0 0 150 176" aria-hidden="true"><path d="M75 142 L10 0 H140 Z" fill="{{c.cone}}"/><g fill="none" stroke-width="3.6" stroke-linecap="round"><path d="M49 142 V92" stroke="{{c.ink}}"/><path d="M49 34 V92" stroke="{{c.partner}}"/></g><ellipse cx="75" cy="142" rx="26" ry="9" fill="{{c.ink}}"/><circle cx="75" cy="142" r="7" fill="{{c.panel}}" stroke="{{c.ink}}" stroke-width="2.5"/><ellipse cx="75" cy="34" rx="26" ry="9" fill="{{c.partner}}"/><circle cx="75" cy="34" r="7" fill="{{c.panel}}" stroke="{{c.partner}}" stroke-width="2.5"/></svg>
      <div style="font-size:34px;font-weight:800;letter-spacing:-.5px">Follower right turn</div>
      <div style="font-size:14px;font-weight:600;color:{{c.muted}}">Next: Hammerlock entry</div>
      <div style="position:absolute;left:16px;bottom:14px;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:700"><span style="color:{{c.muted}};margin-right:4px">count</span><span style="color:{{c.muted}}">1</span><span style="color:{{c.muted}}">2</span><span style="color:{{c.muted}}">3</span><span style="color:{{c.muted}}">4</span><span style="background:{{c.ink}};color:{{c.bg}};border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center">5</span><span style="color:{{c.muted}}">6</span><span style="color:{{c.muted}}">7</span><span style="color:{{c.muted}}">8</span></div>
    </div>
    <div style="width:290px;display:flex;flex-direction:column;gap:12px">
      <div style="background:{{c.panel}};border:2px solid {{c.ink}};border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:12px">
        <div style="font-size:11px;font-weight:800;letter-spacing:2px;color:{{c.muted}}">SPEED</div>
        <div style="display:flex;gap:6px;font-size:12px;font-weight:700"><span style="border:2px solid {{c.ink}};padding:3px 10px;border-radius:999px">Slow</span><span style="background:{{c.ink}};color:{{c.bg}};padding:5px 12px;border-radius:999px">Medium</span><span style="border:2px solid {{c.ink}};padding:3px 10px;border-radius:999px">Song</span></div>
        <div style="font-size:11px;font-weight:800;letter-spacing:2px;color:{{c.muted}}">BEAT</div>
        <div style="display:flex;gap:6px;font-size:12px;font-weight:700"><span style="background:{{c.ink}};color:{{c.bg}};padding:5px 12px;border-radius:999px">Click on</span><span style="border:2px solid {{c.ink}};padding:3px 10px;border-radius:999px">Voice counts</span></div>
      </div>
      <div style="background:{{c.panel}};border:2px solid {{c.ink}};border-radius:10px;padding:12px 16px;flex:1;display:flex;flex-direction:column;gap:2px">
        <div style="font-size:11px;font-weight:800;letter-spacing:2px;color:{{c.muted}};margin-bottom:4px">YOUR COMBO</div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid {{c.rule}};font-size:14px;font-weight:600;color:{{c.muted}}"><span style="flex:1">Basic (side)</span><i style="width:8px;height:8px;border-radius:50%;background:{{c.adjuster}}"></i></div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid {{c.rule}};font-size:14px;font-weight:800"><span style="flex:1">Follower right turn</span><i style="width:8px;height:8px;border-radius:50%;background:{{c.move}}"></i></div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid {{c.rule}};font-size:14px;font-weight:600"><span style="flex:1">Hammerlock entry</span><i style="width:8px;height:8px;border-radius:50%;background:{{c.move}}"></i></div>
        <div style="display:flex;align-items:center;gap:8px;padding:7px 0;font-size:14px;font-weight:600"><span style="flex:1">Hand change</span><i style="width:8px;height:8px;border-radius:50%;background:{{c.adjuster}}"></i></div>
        <div style="margin-top:auto;display:flex;gap:8px;font-size:13px;font-weight:700"><div style="flex:1;border:2px solid {{c.ink}};padding:8px;border-radius:999px;text-align:center">Prev</div><div style="flex:2;background:{{c.ink}};color:{{c.bg}};padding:10px;border-radius:999px;text-align:center">Pause</div><div style="flex:1;border:2px solid {{c.ink}};padding:8px;border-radius:999px;text-align:center">Next</div></div>
      </div>
    </div>
  </div>
<div style="position:absolute;left:0;right:0;bottom:0;height:26px;background:{{c.ink}};color:#ffffff;display:flex;align-items:center;padding:0 28px;font-size:11px;font-weight:600;gap:6px"><b style="font-weight:700">Bachata Move Creator</b><span style="margin-left:auto;opacity:.85">151 moves &middot; 23 positions</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"palette":{"editor":"enum","options":["mvv","munich"],"default":"mvv"},"$preview":{"width":1000,"height":680}}'>
class Component extends DCLogic {
renderVals() {
const P = {
mvv: { bg: '#ffffff', panel: '#f6f7e8', land: '#ebeccc', ink: '#1b2644', muted: '#5d6479', rule: '#dcdec2', accent: '#acc13f', hdrMuted: '#3b4720', link: '#7d849c', partner: '#8a2f86', move: '#2a3f9a', styling: '#2a8a45', adjuster: '#c95d00', onMove: '#ffffff', cone: '#e1e5c0' },
munich: { bg: '#f2f3f4', panel: '#ffffff', land: '#e4e6e8', ink: '#1b1b1b', muted: '#666c73', rule: '#d9dcde', accent: '#f2f3f4', hdrMuted: '#666c73', link: '#8a9096', partner: '#8a2f86', move: '#0065ae', styling: '#52822f', adjuster: '#ec6725', onMove: '#ffffff', cone: '#dde8f2' }
};
return { c: P[this.props.palette] || P.mvv };
}
}
</script>
</body>
</html>
