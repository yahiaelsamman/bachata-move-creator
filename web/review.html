<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review the moves</title>
  <meta name="theme-color" content="#b4441f">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="review.css">
</head>
<body class="review">
  <header class="top">
    <h1>Review the moves</h1>
    <p class="sub">Go through each group and press ✓ if the move is right or ✗ if something is wrong (add a note).
      Your marks stay in this browser. <a href="index.html">← back to the app</a></p>
    <div class="rv-bar" role="status">
      <span id="rv-progress"></span>
      <button id="rv-copy" type="button" class="primary">Copy my notes</button>
      <button id="rv-reset" type="button" class="ghost">Clear all marks</button>
    </div>
    <textarea id="rv-text" class="rv-text" readonly hidden rows="10" aria-label="Your notes, to copy"></textarea>
  </header>
  <main id="rv-main"></main>

  <script src="data.js"></script>
  <script src="../src/graph.js"></script>
  <script src="../src/reach.js"></script>
  <script src="../src/sketch.js"></script>
  <script src="../src/motion.js"></script>
  <script src="../src/review.js"></script>
  <script src="review-page.js"></script>
</body>
</html>
